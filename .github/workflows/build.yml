name: Build cuiviewer

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: "CUI platform to build (all = every supported combo)"
        required: false
        default: "all"
        type: choice
        options: [ all, x11, glfw, sdl2, win32 ]

jobs:
  build:
    name: build (${{ matrix.os }} / ${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - { os: ubuntu-latest, platform: x11 }
          - { os: ubuntu-latest, platform: glfw }
          - { os: ubuntu-latest, platform: sdl2 }
          # Windows (native win32)
          - { os: windows-latest, platform: win32 }

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc libglfw3-dev libsdl2-dev libx11-dev libgl-dev

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake ninja -y
        shell: pwsh

      - name: Configure
        shell: bash
        run: |
          set -e
          WORKSPACE="${GITHUB_WORKSPACE//\\//}"
          CMAKE_ARGS=(-S "${WORKSPACE}" -B "${WORKSPACE}/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCUI_PLATFORM="${{ matrix.platform }}")
          cmake "${CMAKE_ARGS[@]}"

      - name: Build
        shell: bash
        run: cmake --build "${GITHUB_WORKSPACE//\\//}/build" --parallel 2

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cuiviewer-${{ matrix.os }}-${{ matrix.platform }}
          path: |
            build/cuiviewer
            build/cuiviewer.exe
          retention-days: 14
          if-no-files-found: warn
